name: Windows Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: static/app
        run: npm ci --no-fund --no-audit

      - name: Run full acceptance chain
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python scripts/verify_all.py

      - name: Dump acceptance summaries on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path docs/_artifacts/verify-all-summary.json) {
            Write-Host "== verify-all-summary.json =="
            Get-Content docs/_artifacts/verify-all-summary.json
            $verifySummary = Get-Content docs/_artifacts/verify-all-summary.json -Raw | ConvertFrom-Json
            $failedChecks = @($verifySummary.checks | Where-Object { $_.status -ne 'OK' } | ForEach-Object { "$($_.name) ($($_.duration_seconds)s)" })
            if ($failedChecks.Count -gt 0) {
              Write-Output "::error file=scripts/verify_all.py,line=1,title=Acceptance failed::$($failedChecks -join ', ')"
            }
          }
          if (Test-Path docs/_artifacts/strict-system-audit.json) {
            Write-Host "== strict-system-audit.json =="
            Get-Content docs/_artifacts/strict-system-audit.json
            $strictAudit = Get-Content docs/_artifacts/strict-system-audit.json -Raw | ConvertFrom-Json
            if ($strictAudit.overall_status -eq 'failed' -and $strictAudit.issues.Count -gt 0) {
              $issue = $strictAudit.issues[0]
              Write-Output "::error file=static/app/scripts/strict-system-audit.cjs,line=1,title=Strict audit failure::$($issue.flow) [$($issue.severity)] $($issue.observed)"
            } elseif ($strictAudit.overall_status -eq 'passed_with_coverage_gap' -and $strictAudit.issues.Count -gt 0) {
              $issue = $strictAudit.issues[0]
              Write-Output "::notice file=static/app/scripts/strict-system-audit.cjs,line=1,title=Strict audit coverage gap::$($issue.flow) [$($issue.severity)] $($issue.observed)"
            }
          }

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-artifacts
          path: docs/_artifacts/**
          if-no-files-found: warn
