name: Windows Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: static/app
        run: npm ci --no-fund --no-audit

      - name: Run full acceptance chain
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python scripts/verify_all.py

      - name: Dump acceptance summaries on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path docs/_artifacts/verify-all-summary.json) {
            Write-Host "== verify-all-summary.json =="
            Get-Content docs/_artifacts/verify-all-summary.json
          }
          if (Test-Path docs/_artifacts/strict-system-audit.json) {
            Write-Host "== strict-system-audit.json =="
            Get-Content docs/_artifacts/strict-system-audit.json
          }

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-artifacts
          path: docs/_artifacts/**
          if-no-files-found: warn
